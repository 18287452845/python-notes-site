<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Python while 执行流程</title>
  <style>
    .title { font: 700 32px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3437; }
    .code { font: 23px Consolas, "Courier New", monospace; fill: #273238; }
    .label { font: 600 23px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
    .note { font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5153; }
    .branch { font: 700 21px Consolas, "Courier New", monospace; fill: #b52d2d; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b52d2d"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="54" text-anchor="middle" class="title">Python while 循环的执行流程</text>
  <rect x="40" y="112" width="405" height="325" rx="8" fill="#fffde9" stroke="#b52d2d" stroke-width="3"/>
  <text x="70" y="162" class="code">count = 0</text>
  <text x="70" y="222" class="code">while count &lt; 5:</text>
  <text x="70" y="282" class="code">    print('Hello World')</text>
  <text x="70" y="342" class="code">    count += 1</text>
  <text x="70" y="405" class="note">每轮更新控制变量</text>

  <rect x="545" y="100" width="190" height="70" rx="8" fill="#4b5153"/>
  <text x="640" y="145" text-anchor="middle" class="label">初始化 count</text>
  <path d="M640 170 V220" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <polygon points="640,220 795,292 640,364 485,292" fill="#f4f7f7" stroke="#b52d2d" stroke-width="4"/>
  <text x="640" y="285" text-anchor="middle" class="note">count &lt; 5？</text>
  <path d="M640 364 V414" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="660" y="405" class="branch">True</text>
  <rect x="545" y="414" width="190" height="70" rx="8" fill="#b52d2d"/>
  <text x="640" y="459" text-anchor="middle" class="label">执行循环体</text>
  <rect x="545" y="535" width="190" height="70" rx="8" fill="#b52d2d"/>
  <text x="640" y="580" text-anchor="middle" class="label">count += 1</text>
  <path d="M545 570 H405 V292 H480" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M795 292 H1000 V570 H735" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="815" y="276" class="branch">False</text>
  <rect x="535" y="645" width="210" height="50" rx="8" fill="#4b5153"/>
  <text x="640" y="678" text-anchor="middle" class="label">循环结束</text>
  <text x="830" y="675" class="note">条件最终变为 False，离开循环</text>
</svg>
