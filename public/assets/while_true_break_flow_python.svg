<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Python while True 与 break 执行流程</title>
  <style>
    .title { font: 700 32px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f3437; }
    .code { font: 23px Consolas, "Courier New", monospace; fill: #273238; }
    .label { font: 600 23px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
    .note { font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5153; }
    .branch { font: 700 21px Consolas, "Courier New", monospace; fill: #b52d2d; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b52d2d"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="54" text-anchor="middle" class="title">Python while True + break：先执行，再判断</text>
  <rect x="40" y="112" width="405" height="325" rx="8" fill="#fffde9" stroke="#b52d2d" stroke-width="3"/>
  <text x="70" y="162" class="code">while True:</text>
  <text x="70" y="222" class="code">    answer = input(...)</text>
  <text x="70" y="282" class="code">    if answer:</text>
  <text x="70" y="342" class="code">        break</text>
  <text x="70" y="405" class="note">满足结束条件时退出</text>

  <rect x="545" y="100" width="190" height="70" rx="8" fill="#b52d2d"/>
  <text x="640" y="145" text-anchor="middle" class="label">进入循环</text>
  <path d="M640 170 V220" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="545" y="220" width="190" height="70" rx="8" fill="#b52d2d"/>
  <text x="640" y="265" text-anchor="middle" class="label">执行输入</text>
  <path d="M640 290 V340" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <polygon points="640,340 795,412 640,484 485,412" fill="#f4f7f7" stroke="#b52d2d" stroke-width="4"/>
  <text x="640" y="405" text-anchor="middle" class="note">输入有效？</text>
  <path d="M640 484 V535" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="660" y="525" class="branch">True</text>
  <rect x="545" y="535" width="190" height="70" rx="8" fill="#4b5153"/>
  <text x="640" y="580" text-anchor="middle" class="label">break，退出</text>
  <path d="M795 412 H1000 V235 H735" fill="none" stroke="#b52d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="815" y="396" class="branch">False</text>
  <text x="830" y="230" class="note">继续下一轮</text>
  <text x="640" y="675" text-anchor="middle" class="note">Python 用 while True 配合 break 表达“先执行一次，再判断是否结束”</text>
</svg>
