name: Sync Content And Deploy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4

      - name: Checkout Markdown repository
        uses: actions/checkout@v4
        with:
          repository: 18287452845/python-notes-content
          path: content

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build site from Markdown
        env:
          CONTENT_DIR: ${{ github.workspace }}/content
        run: npm run build

      - name: Validate generated site
        run: npm run check

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "build: sync generated site [skip ci]"
          git push

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@latest pages deploy public --project-name python-notes --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 56dda3bd89d39733f0810ec557ff72a5
