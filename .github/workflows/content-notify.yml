name: Notify Site Sync

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/assets/**"
      - "course-config.json"

jobs:
  notify:
    if: ${{ secrets.SITE_REPO_DISPATCH_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Request immediate site sync
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/18287452845/python-notes-site/dispatches \
            -f event_type=content-updated \
            -f client_payload[content_sha]="${{ github.sha }}"
